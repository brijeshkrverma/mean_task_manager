services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: ${MONGO_DB:-task_manager}
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  api:
    build:
      context: ./api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      # .env me MONGO_URI set hai (Atlas) to wahi use hoga; nahi to neeche
      # wala local `mongo` container. Atlas pe chalana ho to .env me
      # MONGO_URI rakhein, local container pe chalana ho to use comment
      # kar dein — code me kuch badalne ki zaroorat nahi.
      MONGO_URI: ${MONGO_URI:-mongodb://mongo:27017/task_manager}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1d}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${API_PORT:-3000}:3000"

  worker:
    build:
      context: ./worker
    restart: unless-stopped
    environment:
      NODE_ENV: production
      # api ke saath bilkul same value — dono ka ek hi database hona zaroori
      # hai, warna worker khali collection me jhaankta rahega aur koi error
      # bhi nahi aayega.
      MONGO_URI: ${MONGO_URI:-mongodb://mongo:27017/task_manager}
      REDIS_URL: redis://redis:6379
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-5}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-8080}:80"

volumes:
  mongo-data:
  redis-data:
